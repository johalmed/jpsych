name: Build jAudio Math MIDI
on:
  workflow_dispatch:
  push:
    paths: ['jAudio_MathMIDI/**']
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S jAudio_MathMIDI -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package VST3
        shell: pwsh
        run: |
          $v = Get-ChildItem build -Recurse -Filter "*.vst3" -Directory | Select-Object -First 1
          if (-not $v) { throw "VST3 not found" }
          Compress-Archive -Path $v.FullName -DestinationPath jAudio-Math-MIDI-Windows-x64-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: jAudio-Math-MIDI-Windows-x64-VST3
          path: jAudio-Math-MIDI-Windows-x64-VST3.zip